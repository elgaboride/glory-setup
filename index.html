<!doctype html>
<html lang="es" data-tema="oscuro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Glory Setup</title>
  <meta name="description" content="Setup de suspensión, geometría y neumáticos para mi Giant Glory Advanced.">
  <meta name="theme-color" content="#0b0d10">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="barra">
    <div class="barra-txt">
      <span class="marca">Glory Setup</span>
      <span id="montado" class="montado">Cargando…</span>
    </div>
    <button id="btn-tema" class="btn-icono" type="button" aria-label="Cambiar entre modo oscuro y modo sol">☀</button>
  </header>
  <button id="aviso-version" type="button" hidden>Hay una versión nueva, toca para actualizar</button>
  <main id="vista" tabindex="-1"><p class="cargando">Cargando…</p></main>
  <footer class="pie" id="pie"></footer>
  <nav class="tabs" aria-label="Secciones">
    <button type="button" data-tab="setup" class="activo"><span aria-hidden="true">◎</span>Setup</button>
    <button type="button" data-tab="bitacora"><span aria-hidden="true">✎</span>Bitácora</button>
    <button type="button" data-tab="comparar"><span aria-hidden="true">⇄</span>Comparar</button>
    <button type="button" data-tab="bici"><span aria-hidden="true">⚙</span>Mi bici</button>
  </nav>
  <dialog id="dlg"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="version.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
